name: Build/release

on: [push, pull_request]

jobs:
    extension-platform:
        name: Extension Platform V1 (${{ matrix.os }})
        runs-on: ${{ matrix.os }}

        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-2022]

        steps:
            - name: Check out Git repository
              uses: actions/checkout@v4

            - name: Install Node.js and NPM
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Build TypeScript sources
              run: npm run build-src

            - name: Typecheck and test Extension Platform V1
              run: npm run test:extension-platform

    extension-platform-electron-smoke:
        name: Extension Platform Electron smoke
        runs-on: ubuntu-latest

        steps:
            - name: Check out Git repository
              uses: actions/checkout@v4

            - name: Install Node.js and NPM
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies and Electron
              run: |
                  npm ci --ignore-scripts
                  node node_modules/electron/install.js

            - name: Build TypeScript sources
              run: npm run build-src

            - name: Launch Electron sandbox smoke test
              run: xvfb-run --auto-servernum npx electron --no-sandbox tests/extension-platform-v1/electron-smoke-main.js

    release:
        if: github.event_name == 'push'
        runs-on: ${{ matrix.os }}

        # Platforms to build on/for
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-2022]

        steps:
            - name: Check out Git repository
              uses: actions/checkout@v3

            - name: Install Node.js, NPM and Yarn
              uses: actions/setup-node@v3
              with:
                  node-version: 20

            - name: Additional step from MaCOS
              if: startsWith(matrix.os, 'macos')
              run: sudo -H pip install setuptools

            - name: Additional step for ubuntu
              if: startsWith(matrix.os, 'ubuntu')
              run: |
                sudo apt update
                sudo apt-get install libudev-dev

            #- name: Install Snapcraft
            #  uses: samuelmeuli/action-snapcraft@v1
            #  # Only install Snapcraft on Ubuntu
            #  if: startsWith(matrix.os, 'ubuntu')
            #  with:
            #    # Log in to Snap Store
            #    snapcraft_token: ${{ secrets.snapcraft_token }}
            #- name: Prepare for app notarization (macOS)
            #  if: startsWith(matrix.os, 'macos')
            #  # Import Apple API key for app notarization on macOS
            #  run: |
            #    mkdir -p ~/private_keys/
            #    echo '${{ secrets.api_key }}' > ~/private_keys/AuthKey_${{ secrets.api_key_id }}.p8
            - name: Build/release Electron app
              uses: coparse-inc/action-electron-builder@v1.0.0
              with:
                  # GitHub token, automatically provided to the action
                  # (No need to define this secret in the repo settings)
                  github_token: ${{ secrets.github_token }}

                  ## macOS code signing certificate
                  #mac_certs: ${{ secrets.mac_certs }}
                  #mac_certs_password: ${{ secrets.mac_certs_password }}

                  ## If the commit is tagged with a version (e.g. "v1.0.0"),
                  ## release the app after building
                  #release: ${{ startsWith(github.ref, 'refs/tags/v') }}
                  release: 1
              #env:
              ## macOS notarization API key
              #API_KEY_ID: ${{ secrets.api_key_id }}
              #API_KEY_ISSUER_ID: ${{ secrets.api_key_issuer_id }}
